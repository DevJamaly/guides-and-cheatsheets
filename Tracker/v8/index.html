function poolPanel(title,key,sub,showTier){
  const pool=S[key], p=el("div","panel");
  const complete=pool.filter(x=>x.at>=x.total).length;
  p.innerHTML=`<div class="mode-head"><div><h2>${title}</h2><p class="sub" style="margin:2px 0 0">${sub}</p></div><div class="wk">${complete}/${pool.length} complete</div></div>`;
  pool.forEach(item=>{
    const t=el("div","thread"); const isDone=item.at>=item.total;
    const ti=el("div","ti");
    const pct=item.total?Math.round(item.at/item.total*100):0;
    ti.innerHTML=`<div class="nm${isDone?" done":""}">${esc(item.label)}</div>
      <div class="cad">${item.at}/${item.total}${showTier&&item.tier?" · Tier "+item.tier:""}</div>
      <div class="pbar"><i style="width:${pct}%"></i></div>`;
    t.appendChild(ti);
    if(item.total>1){
      const c=el("div","counter");
      const m=el("button"); m.textContent="–"; m.onclick=()=>{ item.at=Math.max(0,item.at-1); save(); render(); };
      const nn=el("span","num"); nn.textContent=item.at+"/"+item.total;
      const pl=el("button"); pl.textContent="+"; pl.onclick=()=>{ item.at=Math.min(item.total,item.at+1); save(); render(); };
      c.append(m,nn,pl); t.appendChild(c);
    } else {
      const chk=el("div","pchk"+(isDone?" on":"")); chk.innerHTML=isDone?'<svg viewBox="0 0 12 12"><path d="M1 6l3.5 3.5L11 2" fill="none" stroke="#06231b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>':"";
      chk.onclick=()=>{ item.at=isDone?0:1; save(); render(); };
      t.appendChild(chk);
    }
    p.appendChild(t);
  });
  return p;
}

/* ---------- DATA ---------- */
function viewData(){
  const box=el("div");
  if(!SAFE_TO_SAVE){
    const f=el("div","flags"); const w=el("div","flag");
    w.innerHTML=`<div class="fi">Data</div><div class="ft"><b>The data saved in this browser could not be loaded</b> (${esc(LOAD_ERROR&&LOAD_ERROR.message||"unknown error")}). You're looking at the starting plan in memory and <b>nothing is being saved</b>, so your stored data is untouched. Download it below to inspect or repair, pull from the cloud, import a good backup, or reset to start fresh.</div>`;
    f.appendChild(w); box.appendChild(f);
  }
  const p=el("div","panel");
  p.innerHTML=`<h2>Your data</h2><p class="sub">Everything lives in this browser's localStorage (and your private gist if sync is on). Export regularly — that JSON is your offline backup.</p>`;
  const row=el("div","row");
  const exp=el("button","btn pri"); exp.textContent="Export JSON"; exp.onclick=exportJSON;
  const imp=el("button","btn"); imp.textContent="Import JSON";
  const file=el("input"); file.type="file"; file.accept="application/json,.json"; file.style.display="none";
  imp.onclick=()=>file.click(); file.onchange=e=>{ importJSON(e.target.files[0]); file.value=""; };
  row.append(exp,imp,file);
  if(!SAFE_TO_SAVE){ const raw=el("button","btn"); raw.textContent="Download stored (unloadable) data"; raw.onclick=downloadRawStored; row.append(raw); }
  const reset=el("button","btn ghost"); reset.textContent="Reset to seed"; reset.style.marginLeft="auto";
  reset.title="Wipe everything back to the starting plan. Export first if unsure."+(syncOn()?" This also overwrites the cloud copy.":"");
  reset.onclick=()=>arm(reset,"Click again to wipe everything",()=>{ S=structuredClone(SEED); SAFE_TO_SAVE=true; LOAD_ERROR=null; NOTICE=null; OPEN.clear(); save(); render(); toast("Reset to the starting plan."); });
  row.append(reset); p.appendChild(row); box.appendChild(p);
  box.appendChild(syncPanel());

  const bd=el("div","panel");
  bd.innerHTML=`<h2>Budgets & pace</h2><p class="sub">Sessions planned per week in each mode. DEFAULT is also what "1.0×" velocity means, so raising it makes the projection ask more of you. Session hours only affect the hour estimates.</p>`;
  bd.appendChild(inlineNum("DEFAULT sessions / week",S.budgets.DEFAULT,1,v=>S.budgets.DEFAULT=v));
  bd.appendChild(inlineNum("REDUCED sessions / week",S.budgets.REDUCED,0,v=>S.budgets.REDUCED=v));
  bd.appendChild(inlineNum("FALLBACK sessions / week",S.budgets.FALLBACK,0,v=>S.budgets.FALLBACK=v));
  bd.appendChild(inlineNum("Soft cap (sessions / week)",S.softCap,1,v=>S.softCap=v));
  bd.appendChild(inlineNum("Hours per session",S.sessionHours,0.25,v=>S.sessionHours=v,0.25));
  bd.appendChild(inlineNum("Provisional velocity (× until 3 wks logged)",S.provisionalVelocity,0.05,v=>S.provisionalVelocity=v,0.05));
  bd.appendChild(inlineNum("DSA problems target",S.dsaTarget,1,v=>S.dsaTarget=v));
  box.appendChild(bd);

  box.appendChild(historyPanel());

  const ui=el("div","panel");
  ui.innerHTML=`<h2>Display</h2><p class="sub">Text size multiplier for the whole app (1 = original, 1.2 = default, 1.5 = large).</p>`;
  ui.appendChild(inlineNum("Text size (×)",S.ui.textScale,0.8,v=>S.ui.textScale=Math.min(2,v),0.05));
  box.appendChild(ui);

  const th=el("div","panel");
  th.innerHTML=`<h2>Flag thresholds</h2><p class="sub">When the app nudges you.</p>`;
  th.appendChild(inlineNum("Stale-work flag (days)",S.thresholds.stale,1,v=>S.thresholds.stale=v));
  th.appendChild(inlineNum("Daily-rep flag (days)",S.thresholds.drill,1,v=>S.thresholds.drill=v));
  th.appendChild(inlineNum("Keep-warm minutes",S.keepWarmMinutes,1,v=>S.keepWarmMinutes=v));
  box.appendChild(th);

  const pe=el("div","panel"); pe.innerHTML=`<h2>Profile</h2>`;
  pe.appendChild(txt("Name",S.profile.name,v=>{ S.profile.name=v; return true; }));
  pe.appendChild(txt("Current position",S.profile.position,v=>{ S.profile.position=v; return true; }));
  pe.appendChild(txt("Journey start (YYYY-MM-DD)",S.meta.startDate,v=>{ if(!parseLocalDate(v)){ toast("Use a real date in YYYY-MM-DD form."); return false; } S.meta.startDate=v.trim(); return true; }));
  box.appendChild(pe);

  const hint=el("div","panel");
  hint.innerHTML=`<h2>Deploying & data safety</h2><div class="muted-note" style="line-height:1.7">One self-contained file — put it on any free static host (Vercel, GitHub Pages, Netlify, Cloudflare Pages). <b>Your data is never on the host</b>: it lives in this browser's storage and, if cloud sync is on, in your private gist. Without sync each device is its own island — export/import to move data by hand. Nothing else phones home; no server of ours.</div>`;
  box.appendChild(hint);
  return box;
}
/* Closed weeks. Each row opens the backfill popup: tick tasks, log sittings, fix rep days and the
   session count — all attributed to THAT week. Live logging on the Roadmap always belongs to the
   current week; this popup is the only place the past can be edited, and it does so explicitly. */
function historyPanel(){
  const p=el("div","panel");
  p.innerHTML=`<h2>Week history</h2><p class="sub">Closed weeks, newest first. Click one to open it — tick what you actually finished, log the sittings, fix quiz/DSA days. Everything you change in the popup is credited to <b>that</b> week (it feeds velocity) and the roadmap advances, so backfilled tasks never reappear in a new week plan.</p>`;
  const thisKey=weekKey(new Date());
  const rows=S.history.filter(h=>weekKey(new Date(h.startISO))!==thisKey).slice().reverse();
  if(!rows.length){ const n=el("div","muted-note"); n.textContent="No closed weeks yet."; p.appendChild(n); return p; }
  rows.forEach(h=>{
    const f=el("div","field inline");
    const l=el("label"); l.textContent="Week of "+fmtDate(weekStartOf(new Date(h.startISO)));
    const s=el("span","muted-note"); s.textContent=(h.mode||"undeclared")+" · "+h.sessions+" session"+(h.sessions===1?"":"s")+(h.estimated?" (estimated)":"");
    const b=el("button","btn"); b.textContent="Open →"; b.onclick=()=>openBackfill(weekKey(new Date(h.startISO)));
    f.append(l,s,b); p.appendChild(f);
  });
  return p;
}
// The popup itself. Re-rendered from state on every change; scroll position is preserved.
function backfillModal(){
  const h=bfEntry(); if(!h) { BF=null; return null; }
  const wkStart=weekStartOf(new Date(h.startISO));
  const back=el("div","bf-back"); back.onclick=e=>{ if(e.target===back) closeBackfill(); };
  const m=el("div","panel bf"); back.appendChild(m);
  m.onscroll=()=>{ BF_SCROLL=m.scrollTop; };

  const head=el("div","mode-head");
  head.innerHTML=`<div><h2>Backfill · week of ${fmtDate(wkStart)}</h2><p class="sub" style="margin:2px 0 0">Everything here is credited to <b>this closed week</b> — the current week's count doesn't move.</p></div>`;
  const close=el("button","btn"); close.textContent="Close"; close.onclick=closeBackfill;
  head.appendChild(close); m.appendChild(head);

  // record: mode + sessions
  const rec=el("div","field inline");
  const rl=el("label"); rl.textContent="Declared mode · sessions that week";
  const sel=el("select");
  [["","— undeclared"],["DEFAULT","DEFAULT"],["REDUCED","REDUCED"],["FALLBACK","FALLBACK"]].forEach(([v,t])=>{ const o=el("option"); o.value=v; o.textContent=t; if((h.mode||"")===v) o.selected=true; sel.appendChild(o); });
  sel.onchange=()=>{ h.mode=sel.value||null; save(); render(); };
  const num=el("input"); num.type="number"; num.min="0"; num.value=h.sessions; num.title="Override the session count by hand (sittings logged below adjust it automatically)";
  num.onchange=()=>{ const v=parseInt(num.value,10); if(Number.isFinite(v)&&v>=0){ h.sessions=v; delete h.estimated; } save(); render(); };
  rec.append(rl,sel,num); m.appendChild(rec);

  // daily rep for that week
  const rh=el("div","htrk"); rh.textContent="Daily rep that week (Q quiz · D DSA)"; m.appendChild(rh);
  const strip=el("div","drill"); const today=isoDay(new Date());
  [...Array(7)].map((_,i)=>addDays(wkStart,i)).forEach(d=>{
    const ds=isoDay(d), sched=repTypeFor(d);
    const logged = S.dsaLog.includes(ds) ? "dsa" : (S.drillLog.includes(ds) ? "drill" : null);
    const c=el("button","dcell"+(logged?" on":"")+(ds===today?" today":""));
    c.textContent=REP[logged||sched].letter;
    c.title=fmtDate(d)+" · scheduled: "+REP[sched].name+(logged?" · logged: "+REP[logged].name:"");
    c.onclick=()=>{ toggleRep(ds); save(); render(); };
    strip.appendChild(c);
  });
  m.appendChild(strip);

  // tasks, grouped by track — sittings logged here belong to this closed week
  const th=el("div","htrk"); th.textContent="Tasks — tick ✓ finished · ± sittings credit this week"; m.appendChild(th);
  S.tracks.forEach(t=>{
    if(t.status==="done") return;
    // only tracks you have actually started (or the active one) — future tracks would flood the list
    if(t.status!=="active" && !t.tasks.some(hasProgress)) return;
    const tt=el("div","htrk"); tt.textContent=t.name; tt.style.color="var(--accent)"; m.appendChild(tt);
    t.tasks.forEach(x=>{
      const complete=taskComplete(x);
      const r=el("div","btask"+(complete?" done":""));
      const chk=el("div","bchk"+(complete?" on":"")); chk.title=complete?"Reopen":"Mark finished (adds no sittings)";
      chk.innerHTML=complete?'<svg viewBox="0 0 12 12" width="11" height="11"><path d="M1 6l3.5 3.5L11 2" fill="none" stroke="#06231b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>':"";
      chk.onclick=()=>bfToggleDone(t.id,x.id);
      const lbl=el("div","lbl"); lbl.textContent=x.label;
      const cnt=el("div","cnt"); cnt.textContent=x.logged+"/"+(x.done?Math.max(1,x.est):x.est);
      const minus=el("button"); minus.textContent="–"; minus.title="Un-log one sitting from this week"; minus.onclick=()=>bfLogTask(t.id,x.id,-1);
      const plus=el("button"); plus.textContent="+ sitting"; plus.title="Log one sitting, credited to this week"; plus.onclick=()=>bfLogTask(t.id,x.id,+1);
      r.append(chk,lbl,cnt,minus,plus); m.appendChild(r);
    });
  });
  (window.requestAnimationFrame||setTimeout)(()=>{ m.scrollTop=BF_SCROLL; });
  return back;
}
function inlineNum(label,val,min,onset,step){
  const f=el("div","field inline"); const l=el("label"); l.textContent=label;
  const i=el("input"); i.type="number"; i.min=String(min); if(step) i.step=String(step); i.value=val;
  i.onchange=()=>{ const v=step?parseFloat(i.value):parseInt(i.value,10); if(Number.isFinite(v)&&v>=min) onset(v); save(); render(); };
  f.append(l,i); return f;
}
function txt(label,val,onset){
  const f=el("div","field"); const l=el("label"); l.textContent=label;
  const i=el("input"); i.value=val;
  i.onchange=()=>{ if(onset(i.value)===false){ i.value=val; return; } save(); render(); };
  f.append(l,i); return f;
}

/* ===================== ACTIONS ===================== */
function declareWeek(mode){ NOTICE=null; S.currentWeek=generateWeek(mode, S.currentWeek); save(); render(); }
function pullNext(){
  const cur=S.currentWeek; if(!cur) return;
  const next=cur.planned+1;
  const before=cur.planned;
  S.currentWeek=generateWeek(cur.mode, cur, next);
  if(weekPlanned(S.currentWeek)<=before) toast("Nothing left to pull — every deep-work task on the roadmap is planned or complete.");
  save(); render();
}
function pullPassive(group){
  const cur=S.currentWeek; if(!cur) return;
  const it=nextPassive(group, new Set(cur.items.map(i=>i.ref)));
  if(!it){ toast("Nothing left in "+group+" — every item is either already in this week or complete."); return; }
  it._done=false; cur.items.push(it); cur.dismissed=cur.dismissed.filter(g=>g!==group); save(); render();
}
// Remove a passive item the user added (or the mode added) by mistake. Undoes any pool unit it logged.
// Remembers the dismissal for this week so Regenerate / mode re-declare doesn't put it straight back.
function removeWeekItem(it){
  const cur=S.currentWeek; if(!cur) return;
  const i=cur.items.findIndex(x=>x.ref===it.ref); if(i<0) return;
  const item=cur.items[i];
  if(item.poolName){ const pi=poolItem(item.poolName,item.poolId); if(pi) pi.at=Math.max(0,pi.at-Math.max(0,item._applied||0)); if(!cur.dismissed.includes(item.poolName)) cur.dismissed.push(item.poolName); }
  cur.items.splice(i,1); save(); render();
}
// Keep-warm item: a simple tick.
function toggleWeekItem(it){
  const cur=S.currentWeek; if(!cur) return;
  const item=cur.items.find(x=>x.ref===it.ref); if(!item) return;
  if(item.poolName){ logPoolUnit(it,+1); return; }
  item._done=!item._done;
  if(item.keepwarm && item._done) touch(item.trackId);
  save(); render();
}
// Passive (pool) item: click = +1 unit, "–" = undo one. _applied = units logged via this week's row,
// so removing the row or undoing can only give back what this week added. Returns true if changed.
function logPoolUnit(it,delta){
  const cur=S.currentWeek; if(!cur) return false;
  const item=cur.items.find(x=>x.ref===it.ref); if(!item||!item.poolName) return false;
  const pi=poolItem(item.poolName,item.poolId); if(!pi) return false;
  const applied=Math.max(0,item._applied||0);
  if(delta<0 && applied<=0) return false;
  const before=pi.at; pi.at=clamp(pi.at+delta,0,pi.total); const d=pi.at-before;
  if(!d) return false;
  item._applied=Math.max(0,applied+d); item._done=item._applied>0;
  save(); render(); return true;
}
function rollWeek(){
  const cur=S.currentWeek; if(!cur) return;
  const ws=weekSessions();
  pushHistory({startISO:cur.startISO, mode:cur.mode, planned:cur.planned, sessions:ws});
  S.currentWeek=null; NOTICE=null; save(); TAB="week"; render();
  toast("Week rolled: "+ws+" session"+(ws===1?"":"s")+" logged as "+cur.mode+". Anything you log later this week still counts.");
}
function exportJSON(){
  const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=el("a"); a.href=URL.createObjectURL(blob); a.download="journey-"+isoDay(new Date())+".json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function downloadRawStored(){
  let raw=null; try{ raw=localStorage.getItem(KEY); }catch(e){}
  if(!raw){ toast("Nothing stored."); return; }
  const blob=new Blob([raw],{type:"application/json"});
  const a=el("a"); a.href=URL.createObjectURL(blob); a.download="journey-raw-"+isoDay(new Date())+".json"; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importJSON(file){
  if(!file) return; const r=new FileReader();
  r.onload=()=>{
    const prevS=S, prevSafe=SAFE_TO_SAVE, prevErr=LOAD_ERROR;
    try{
      const s=migrate(JSON.parse(r.result));
      S=s; SAFE_TO_SAVE=true; LOAD_ERROR=null; NOTICE=null; OPEN.clear();
      render();
      save(); toast("Imported.");
    }catch(e){
      console.error("import failed",e);
      S=prevS; SAFE_TO_SAVE=prevSafe; LOAD_ERROR=prevErr;
      try{ render(); }catch(_){}
      toast("That file didn't parse as valid journey JSON. Nothing was changed.\n\n"+(e&&e.message||""));
    }
  };
  r.onerror=()=>toast("Couldn't read that file.");
  r.readAsText(file);
}

/* ===================== BOOT ===================== */
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>{ TAB=b.dataset.tab; render(); });
render();
if(syncOn()) syncPull("boot");
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ if(syncOn()) syncPull("visible"); else render(); } else syncFlushNow(); });
window.addEventListener("pagehide",syncFlushNow);
window.addEventListener("online",()=>{ if(syncOn()) syncPull("online"); });
setInterval(renderSyncPill,60000);
